<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>kick the ball</title>
  </head>
  <body class="bg-black text-white">
    <div class="w-lg h-96 p-10 m-auto">
      <h1 class="pb-5 text-4xl font-bold">become the soccer ball</h1>
      <div class="flex">
        <div class="flex-7 flex-col">
          <img id="mellow" width="300" height="300" src="./img/main1.png" />
          <p class="hidden" id="dbg-mellow-state">game not started</p>
          <p class="hidden" id="dbg-canplay"></p>
        </div>
        <div class="flex flex-5 flex-col">
          <h3 class="text-xl font-bold">Score:</h3>
          <h5 class="text-lg text-orange-400" id="score">score: 0</h5>
          <h3 class="text-xl font-bold">Best Score:</h3>
          <h5 class="text-lg text-green-500" id="best-score">best: 0</h5>
        </div>
      </div>

      <p>use space to kick and start the game!</p>
    </div>
    <script src="./main.ts"></script>
  </body>
</html>
